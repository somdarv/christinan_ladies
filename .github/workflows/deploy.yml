name: Deploy to cPanel (server pulls + builds)

# On push to main, SSH into Namecheap cPanel and have the SERVER pull the
# latest code from GitHub, build the Next.js app, and restart Passenger.
# No build artifacts are shipped from CI — the server builds its own copy.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-ccwim
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH → git pull, build, restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: "21098"
          command_timeout: 20m
          script: |
            set -e
            # Node lives only inside the cPanel Node.js app's virtualenv.
            export PATH="$HOME/nodevenv/theccm/20/bin:$PATH"
            # Clear the venv's production/NODE_PATH so devDeps install and the
            # build resolves modules from the app's own real node_modules.
            unset NODE_ENV NODE_PATH
            # Cap native thread pools: Turbopack's Rust pool is sized to the
            # host's ~23 CPUs and trips the CloudLinux LVE per-user thread
            # limit (intermittent `spawn node EAGAIN`). Keep the build small.
            export RAYON_NUM_THREADS=2 UV_THREADPOOL_SIZE=2 \
                   NEXT_TELEMETRY_DISABLED=1 NODE_OPTIONS=--max-old-space-size=1024
            cd "$HOME/theccm"
            git fetch --depth=1 origin main
            git reset --hard origin/main
            git gc --prune=now --quiet || true
            npm ci --include=dev --no-audit --no-fund
            npm run build
            npm prune --omit=dev          # drop build-only deps from runtime
            mkdir -p tmp && touch tmp/restart.txt
            echo "Deployed $(git rev-parse --short HEAD)"
